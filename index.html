<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SH DONAT TJ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #14141c;
            --card-border: #222230;
            --accent-orange: #ff7a00;
            --accent-glow: rgba(255, 122, 0, 0.25);
            --text-main: #ffffff;
            --text-sub: #8e8e9f;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 14px;
            padding-bottom: 75px;
        }

        .user-card {
            background: linear-gradient(135deg, #181824 0%, #101017 100%);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .balance-title { font-size: 11px; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; }
        .balance-value { font-size: 28px; font-weight: 900; margin: 4px 0 14px 0; color: #fff; }

        .balance-btns { display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 10px;
            background: #1f1f2d; border: 1px solid #2d2d42;
            border-radius: 12px; color: #fff; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.97); }

        .section-title { font-size: 12px; color: var(--text-sub); margin: 18px 0 10px 0; font-weight: 800; text-transform: uppercase; }

        .game-banner {
            position: relative; height: 110px; border-radius: 18px;
            overflow: hidden; margin-bottom: 12px; border: 1px solid var(--card-border);
            cursor: pointer; background-size: cover; background-position: center;
            display: flex; align-items: flex-end; padding: 14px; transition: 0.2s;
        }
        .game-banner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(0deg, rgba(11,11,14,0.95) 0%, rgba(11,11,14,0.2) 100%);
        }
        .banner-content { position: relative; z-index: 2; }
        .game-banner-title { font-size: 18px; font-weight: 900; line-height: 1.1; }
        .game-banner-sub { font-size: 11px; color: var(--accent-orange); font-weight: 800; margin-top: 4px; }

        .grid-products { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .prod-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px; text-align: center;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .prod-card.active {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px var(--accent-glow);
            background: #1a1a26;
        }
        .prod-icon { font-size: 24px; margin-bottom: 6px; }
        .prod-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .prod-price { font-size: 14px; color: var(--accent-orange); font-weight: 900; }

        .input-box {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 14px; margin-top: 16px;
        }
        .input-box label { font-size: 11px; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 700; }
        .input-box input {
            width: 100%; background: #0b0b0e; border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; outline: none;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0f0f14; border-top: 1px solid var(--card-border);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        .nav-item { text-align: center; color: var(--text-sub); font-size: 10px; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--accent-orange); }

        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div id="page-main" class="page active">
        <div class="user-card">
            <div class="balance-title">БАЛАНСИ ШУМО</div>
            <div class="balance-value">0.00 <span style="font-size: 16px; color: var(--text-sub);">TJS</span></div>
            <div class="balance-btns">
                <button class="btn-action">+ Пур кардан</button>
                <button class="btn-action">↗ Баровардан</button>
            </div>
        </div>

        <div class="section-title">Категорияҳо</div>

        <div class="game-banner" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600');" onclick="openGame('Free Fire СНГ', 'ff')">
            <div class="banner-content">
                <div class="game-banner-title">FREE FIRE<br><span style="color: #fff;">СНГ</span></div>
                <div class="game-banner-sub">Харидан ➔</div>
            </div>
        </div>

        <div class="game-banner" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600');" onclick="openGame('Free Fire Индонезия', 'ff')">
            <div class="banner-content">
                <div class="game-banner-title">FREE FIRE<br><span style="color: #fff;">ИНДОНЕЗИЯ</span></div>
                <div class="game-banner-sub">Харидан ➔</div>
            </div>
        </div>

        <div class="game-banner" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600');" onclick="openGame('PUBG Mobile UC', 'pubg')">
            <div class="banner-content">
                <div class="game-banner-title">PUBG MOBILE<br><span style="color: #fff;">UC</span></div>
                <div class="game-banner-sub">Харидан ➔</div>
            </div>
        </div>
    </div>

    <div id="page-buy" class="page">
        <div style="font-weight: 800; margin-bottom: 14px; cursor: pointer; color: var(--text-sub);" onclick="showPage('page-main')">← Бозгашт</div>
        <h2 id="game-title" style="color: var(--accent-orange); margin-top:0; font-size: 22px; font-weight: 900;"></h2>

        <div id="products-container" class="grid-products"></div>

        <div class="input-box">
            <label>ID-И БОЗИРО ВОРИД КУНЕД:</label>
            <input type="number" id="player-id" placeholder="Мисол: 123456789" oninput="checkOrder()">
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showPage('page-main')">🏠<br>Асосӣ</div>
        <div class="nav-item" onclick="alert('Бахши харидҳо')">🛍️<br>Харидҳо</div>
        <div class="nav-item" onclick="alert('Бахши дастгирӣ')">🎧<br>Дастгирӣ</div>
        <div class="nav-item" onclick="alert('Профил')">👤<br>Профил</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentGame = '';
        let selectedProduct = null;

        const ffProducts = [
            { name: '100 Алмазҳо', price: '15 TJS', icon: '💎' },
            { name: '310 Алмазҳо', price: '42 TJS', icon: '💎' },
            { name: '520 Алмазҳо', price: '68 TJS', icon: '💎' },
            { name: '1060 Алмазҳо', price: '135 TJS', icon: '💎' }
        ];

        const pubgProducts = [
            { name: '60 UC', price: '14 TJS', icon: '💵' },
            { name: '325 UC', price: '65 TJS', icon: '💵' },
            { name: '660 UC', price: '125 TJS', icon: '💵' },
            { name: '1800 UC', price: '330 TJS', icon: '💵' }
        ];

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'page-main') tg.MainButton.hide();
        }

        function openGame(gameName, type) {
            currentGame = gameName;
            document.getElementById('game-title').innerText = gameName;
            
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            const list = (type === 'ff') ? ffProducts : pubgProducts;
            
            list.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'prod-card';
                card.onclick = () => selectItem(prod, card);
                card.innerHTML = `
                    <div class="prod-icon">${prod.icon}</div>
                    <div class="prod-title">${prod.name}</div>
                    <div class="prod-price">${prod.price}</div>
                `;
                container.appendChild(card);
            });

            showPage('page-buy');
        }

        function selectItem(prod, cardEl) {
            document.querySelectorAll('.prod-card').forEach(c => c.classList.remove('active'));
            cardEl.classList.add('active');
            selectedProduct = prod;
            checkOrder();
        }

        function checkOrder() {
            const id = document.getElementById('player-id').value;
            if (selectedProduct && id.length >= 5) {
                tg.MainButton.setText(`Оформить заказ (${selectedProduct.price})`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        tg.onEvent('mainButtonClicked', function() {
            const id = document.getElementById('player-id').value;
            tg.sendData(JSON.stringify({
                game: currentGame,
                item: selectedProduct.name,
                price: selectedProduct.price,
                user_id: id
            }));
        });
    </script>
</body>
</html>
